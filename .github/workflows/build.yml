name: Build ViveToolGui EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.402' # 指定适配 Windows App SDK 1.6 的具体 SDK 版本

    - name: Build and Publish WinUI 3 EXE
      run: |
        dotnet publish src/ViveToolGui/ViveToolGui.csproj -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -o ./publish

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ViveToolGui-EXE
        path: ./publish/*
