name: Build ViveToolGui EXE

on:
  workflow_dispatch: # 允许在网页上手动点击触发编译

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Publish Single-File EXE
      run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./publish

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ViveToolGui-EXE
        path: ./publish/*
