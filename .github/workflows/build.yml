name: Build ViveToolGui EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build with MSBuild
        shell: powershell
        run: |
          # 1. 自动获取带有反斜杠的完整绝对路径，避免正斜杠导致 MSBuild 开关解析错误
          $proj = (Get-ChildItem -Path . -Filter "*.csproj" -Recurse | Select-Object -First 1).FullName
          Write-Host "Target Project: $proj"

          # 2. 还原 NuGet 依赖
          nuget restore $proj

          # 3. 传入 Platform=x64 解决 XamlCompiler.exe 报错，并输出到 publish 目录
          msbuild $proj /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:WindowsPackageType=None /p:AppxPackageSigningEnabled=false /p:OutputPath="D:\a\publish\"

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViveToolGui-EXE
          path: D:/a/publish/*
