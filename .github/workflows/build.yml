name: Build ViveToolGui EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find Project and Build
        run: |
          $proj = (Get-ChildItem -Path . -Filter "*.csproj" -Recurse | Select-Object -First 1).FullName
          Write-Host "Found project file: $proj"
          
          dotnet restore "$proj"
          dotnet publish "$proj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:WindowsPackageType=None -p:WindowsSdkPackageVersion=10.0.22621.38 -o ./publish

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViveToolGui-EXE
          path: ./publish/*
