name: Build ViveToolGui EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0.402
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.402'

      - name: Build and Publish WinUI 3 App
        shell: powershell
        run: |
          # 1. 精确获取项目文件路径
          $proj = (Get-ChildItem -Path . -Filter "ViveToolGui.csproj" -Recurse | Select-Object -First 1).FullName
          Write-Host "Project File Path: $proj"

          # 2. 还原 NuGet 依赖
          dotnet restore "$proj"

          # 3. 显式注入 WindowsSdkPackageVersion 解决 Windows App SDK 缺失包引用问题
          dotnet publish "$proj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:WindowsPackageType=None `
            -p:AppxPackageSigningEnabled=false `
            -p:Platform=x64 `
            -p:WindowsSdkPackageVersion=10.0.19041.38 `
            -o D:\a\publish\

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViveToolGui-EXE
          path: D:\a\publish\*
