name: Build ViveToolGui EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 挂载 Visual Studio 2022 环境变量与 MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 2. 安装 .NET SDK 8.0.402（满足 App SDK 依赖）
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.402'

      # 3. 还原 NuGet 包
      - name: Restore NuGet Packages
        run: nuget restore ViveToolGui.sln

      # 4. 使用完整 VS 环境下的 MSBuild 进行 WinUI 3 编译与打包
      - name: Build WinUI3 App with MSBuild
        shell: powershell
        run: |
          msbuild src/ViveToolGui/ViveToolGui.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:PublishProfile=win-x64 `
            /p:WindowsPackageType=None `
            /p:AppxPackageSigningEnabled=false `
            /p:WindowsSdkPackageVersion=10.0.19041.38 `
            /p:OutputPath="D:\a\publish\"

      # 5. 上传打包文件
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViveToolGui-EXE
          path: D:\a\publish\*
