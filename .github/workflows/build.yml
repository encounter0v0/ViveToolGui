name: Build ViveToolGui EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 网页手动点按钮编译

jobs:
  build:
    runs-on: windows‑latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup‑dotnet@v4
        with:
          dotnet‑version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore ViveToolGui.csproj

      - name: Publish Self‑Contained Single‑File EXE
        run: |
          dotnet publish ViveToolGui.csproj `
            -c Release `
            -r win‑x64 `
            --self‑contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -o ./build_output

      - name: Zip artifacts
        shell: pwsh
        run: Compress‑Archive ‑Path ./build_output/* ‑DestinationPath ViveToolGui_win64.zip

      - name: Upload build output
        uses: actions/upload‑artifact@v4
        with:
          name: ViveToolGui_Built
          path: ViveToolGui_win64.zip

